name = "vnts-cf"
main = "src/worker.js"
compatibility_date = "2023-10-30"
[vars]
# 连接后缀：用法 -s wss://域名/后缀
WS_PATH = "vnt"
# 默认网关地址
GATEWAY = "10.26.0.1"
# 子网掩码配置
NETMASK = "255.255.255.0"
# Token白名单：token保持不变
WHITE_TOKEN = "kongdesheng7265"
# 服务器网关显示名称
GATEWAY_NAME = "server"
# 服务端加密：CF 不支持 RSAES-PKCS1-v1_5，保持 false！
SERVER_ENCRYPT = "false"
# 是否禁用中继转发：0 允许中继（对称 NAT 需要中继，保持 0）
DISABLE_RELAY = "0"
HEARTBEAT_INTERVAL = "120"
HEALTH_CHECK_INTERVAL = "3600"
RATE_LIMIT_PER_MINUTE = "30"
CACHE_SAVE_INTERVAL = "3600"
LOG_LEVEL = "info"
# 日志功能保持关闭（烧免费额度）
LOG_PASSWORD = ""
# DO 落亚太节点
LOCATION_HINT = "apac"
[[durable_objects.bindings]]
name = "RELAY_ROOM"
class_name = "RelayRoom"
[[migrations]]
tag = "v1"
new_sqlite_classes = ["RelayRoom"]
